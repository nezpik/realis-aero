name: Design system checks

on:
  push:
    paths: ['tokens/**', 'specimen/**', 'tools/**', 'package.json', '.github/workflows/checks.yml']
  pull_request:
    paths: ['tokens/**', 'specimen/**', 'tools/**', 'package.json', '.github/workflows/checks.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contrast (WCAG) for every token pair, per theme
        run: npm run check:tokens
      - name: Chart series under simulated colour-vision deficiency
        run: npm run check:cvd
      - name: Install Playwright Chromium
        run: npm install --no-package-lock && npx playwright install --with-deps chromium
      - name: Render checks (states, painted contrast, forced colours, print, motion, 200% zoom)
        run: npm run check:render -- --no-screenshots
